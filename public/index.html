
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Passkey Portal</title>
    <script src="/webauthn/index.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f4;
            color: #24332b;
        }
        header {
            background: #276749;
            color: white;
            padding: 22px 8%;
        }
        main { max-width: 900px; margin: 35px auto; padding: 0 18px; }
        .panel {
            background: white;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #0000000d;
        }
        h1, h2 { margin-top: 0; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 11px;
            font-size: 15px;
            border-radius: 6px;
        }
        input, select { border: 1px solid #bbc8bf; }
        button {
            margin-top: 15px;
            border: 0;
            background: #276749;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #1f523a; }
        .secondary { background: #58665e; }
        .message { margin-top: 12px; white-space: pre-wrap; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        .muted { color: #59685f; }
    </style>
</head>
<body>
<header>
    <h1>University Passkey Portal</h1>
    <p>Secure access to IS451 academic records</p>
</header>

<main>
    <section id="authPanel" class="panel">
        <h2>Register a passkey</h2>
        <p class="muted">Use the user ID and one-time enrolment code assigned to you.</p>
        <form id="registerForm">
            <label for="registerId">User ID</label>
            <select id="registerId" required>
                <option value="S1">S1 — Student 1</option>
                <option value="S2">S2 — Student 2</option>
                <option value="L1">L1 — Lecturer 1</option>
            </select>
            <label for="enrolmentCode">One-time enrolment code</label>
            <input id="enrolmentCode" autocomplete="off" required>
            <button type="submit">Create passkey</button>
        </form>
        <p id="registerMessage" class="message" role="status"></p>

        <hr>

        <h2>Log in with a passkey</h2>
        <form id="loginForm">
            <label for="loginId">User ID</label>
            <select id="loginId" required>
                <option value="S1">S1 — Student 1</option>
                <option value="S2">S2 — Student 2</option>
                <option value="L1">L1 — Lecturer 1</option>
            </select>
            <button type="submit">Continue with passkey</button>
        </form>
        <p id="loginMessage" class="message" role="status"></p>
    </section>

    <section id="dashboard" class="panel hidden">
        <h2 id="welcome"></h2>
        <p id="roleLabel" class="muted"></p>

        <h3>IS451 grades</h3>
        <div id="gradesArea"></div>

        <div id="editArea" class="hidden">
            <h3>Update a grade</h3>
            <form id="gradeForm">
                <label for="studentId">Student</label>
                <select id="studentId">
                    <option value="S1">S1 — Ama Mensah</option>
                    <option value="S2">S2 — Kofi Owusu</option>
                </select>
                <label for="grade">Grade</label>
                <select id="grade">
                    <option>A</option><option>A-</option>
                    <option>B+</option><option>B</option><option>B-</option>
                    <option>C+</option><option>C</option><option>C-</option>
                    <option>D</option><option>F</option>
                </select>
                <button type="submit">Save grade</button>
            </form>
            <p id="gradeMessage" class="message" role="status"></p>
        </div>

        <button id="logoutButton" class="secondary">Log out</button>
        <p id="logoutMessage" class="message" role="status"></p>
    </section>
</main>

<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

async function requestJSON(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
        }
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || 'The request failed.');
    }

    return data;
}

document.getElementById('registerForm').addEventListener('submit', async event => {
    event.preventDefault();

    const message = document.getElementById('registerMessage');
    message.textContent = 'Starting passkey registration...';

    try {
        const userId = document.getElementById('registerId').value;
        const enrolmentCode = document.getElementById('enrolmentCode').value;

        const optionsJSON = await requestJSON('/api/register/options', {
            method: 'POST',
            body: JSON.stringify({ userId, enrolmentCode })
        });

        const response = await startRegistration({ optionsJSON });

        const result = await requestJSON('/api/register/verify', {
            method: 'POST',
            body: JSON.stringify({ userId, response })
        });

        message.textContent = result.message;
        document.getElementById('enrolmentCode').value = '';
    } catch (error) {
        message.textContent = error.message;
    }
});

document.getElementById('loginForm').addEventListener('submit', async event => {
    event.preventDefault();

    const message = document.getElementById('loginMessage');
    message.textContent = 'Waiting for passkey verification...';

    try {
        const userId = document.getElementById('loginId').value;

        const optionsJSON = await requestJSON('/api/login/options', {
            method: 'POST',
            body: JSON.stringify({ userId })
        });

        const response = await startAuthentication({ optionsJSON });

        await requestJSON('/api/login/verify', {
            method: 'POST',
            body: JSON.stringify({ userId, response })
        });

        message.textContent = '';
        await showDashboard();
    } catch (error) {
        message.textContent = error.message;
    }
});

async function showDashboard() {
    const { user } = await requestJSON('/api/me');
    
    document.getElementById('logoutMessage').textContent = '';
    document.getElementById('authPanel').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('welcome').textContent = `Welcome, ${user.name}`;
    document.getElementById('roleLabel').textContent =
        `User ID: ${user.id} | Role: ${user.role}`;

    document.getElementById('editArea').classList.toggle(
        'hidden', user.role !== 'lecturer'
    );

    await loadGrades();
}

async function loadGrades() {
    const { grades } = await requestJSON('/api/grades');
    const area = document.getElementById('gradesArea');

    if (!grades.length) {
        area.textContent = 'No grades are available.';
        return;
    }

    const table = document.createElement('table');
    const header = document.createElement('tr');

    ['Student ID', 'Student', 'Course', 'Grade'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        header.appendChild(th);
    });

    const thead = document.createElement('thead');
    thead.appendChild(header);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    grades.forEach(item => {
        const row = document.createElement('tr');

        [item.student_id, item.name, item.course_code, item.grade]
            .forEach(value => {
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            });

        tbody.appendChild(row);
    });

    table.appendChild(tbody);
    area.replaceChildren(table);
}

document.getElementById('gradeForm').addEventListener('submit', async event => {
    event.preventDefault();

    const message = document.getElementById('gradeMessage');

    try {
        const studentId = document.getElementById('studentId').value;
        const grade = document.getElementById('grade').value;

        const result = await requestJSON('/api/grades', {
            method: 'PATCH',
            body: JSON.stringify({ studentId, grade })
        });

        message.textContent = result.message;
        await loadGrades();
    } catch (error) {
        message.textContent = error.message;
    }
});

document.getElementById('logoutButton').addEventListener('click', async () => {
    try {
        await requestJSON('/api/logout', { method: 'POST' });

        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('authPanel').classList.remove('hidden');
        document.getElementById('logoutMessage').textContent =
            'You have logged out successfully.';
    } catch (error) {
        document.getElementById('logoutMessage').textContent = error.message;
    }
});

// If a valid session already exists, show the dashboard.
showDashboard().catch(() => {});
</script>
</body>
</html>
